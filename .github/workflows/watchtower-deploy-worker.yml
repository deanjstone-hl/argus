name: watchtower Deploy Worker

# Production deploys only from the deploy branch (argus-config#600, docs/deploy-branch.md).
# A merge to main builds and tests but deploys nothing; scripts/promote.sh moves deploy.
# A dispatch is still a deploy: an owner step, never run by an agent. It redeploys this target at the head of `deploy`.
#
# The Pages dashboard ships from watchtower-deploy.yml. Before this workflow a promote left
# the argus-watchtower-api Worker behind until someone ran `pnpm run worker:deploy` by hand,
# so the dashboard could call an API contract the live Worker did not serve (argus#983).
#
# `workflow_dispatch` exists because the homelab has no Workers-deploy token (argus#967,
# argus#971): the owner can deploy by running this workflow on `deploy`. GitHub lets a
# dispatch pick any ref, so the job refuses anything but `refs/heads/deploy` itself.
on:
  push:
    branches: [deploy]
    paths:
      - "apps/watchtower/**"
      # Both are bundled into the Worker, so a change to either is a Worker change.
      - "packages/watchtower-contract/**"
      - "packages/bearer-auth/**"
      - ".github/workflows/watchtower-deploy-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time, and a second one queues rather than cancelling a deploy mid-flight.
concurrency:
  group: watchtower-deploy-worker
  cancel-in-progress: false

defaults:
  run:
    working-directory: apps/watchtower

jobs:
  deploy-worker:
    name: Deploy CF Worker
    # A dispatch can name any branch or tag; only `deploy` ships.
    if: github.ref == 'refs/heads/deploy'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # `actions/setup-node` runs BEFORE `pnpm/action-setup`, deliberately: it
      # prepends a known-good npm.
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          run_install: false

      # No `cache: pnpm`, as in the other deploy workflows. A root workspace member, so the
      # install resolves the workspace links the Worker bundles from `packages/`.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Every value this job needs is a key of the `actions` project in Secrets Manager (argus#59):
      # the secret id on the left, the environment variable on the right. sm-action looks a secret up
      # by id, so this block is the one place the ids live. The keys, and the owner step that keeps
      # them (scripts/owner-steps/59.sh):
      #   ARGUS_WATCHTOWER_D1_DATABASE_ID   the D1 database id (not in the tree, argus#1207);
      #                                     scripts/with-d1-id.sh puts it in wrangler.jsonc for each command
      #   ARGUS_CF_D1_TOKEN                 the token for the D1 migration (the deploy token cannot touch D1)
      #   ARGUS_CF_API_TOKEN                the deploy token (Workers Scripts: Edit and nothing else)
      #   ARGUS_CF_ACCOUNT_ID               the Cloudflare account id
      # A key with no secret behind its id makes this step fail, before anything changes.
      - name: Read the deploy values from Secrets Manager
        uses: bitwarden/sm-action@1238aae8fc64b212641190a9227c8a734ab1a793 # v3.0.1
        with:
          access_token: ${{ secrets.BWS_ACCESS_TOKEN }}
          secrets: |
            489cf0ba-dad5-4e70-9f3a-b50500635b92 > WATCHTOWER_D1_DATABASE_ID
            5a91a3c7-4bca-464b-81a5-b50401408e70 > CLOUDFLARE_D1_TOKEN
            daebfc00-1ad4-425e-8c0f-b504014123e0 > CLOUDFLARE_API_TOKEN
            a7767558-b39c-488f-9a1f-b505006359fe > CLOUDFLARE_ACCOUNT_ID

      # Bundles the Worker and validates wrangler.jsonc without uploading anything and
      # without a token, so a config or bundling error stops the job before the schema
      # changes. Needs no build: wrangler bundles src/worker/index.ts itself.
      - name: Dry-run the deploy
        run: bash scripts/with-d1-id.sh pnpm exec wrangler deploy --dry-run --outdir "$RUNNER_TEMP/watchtower-dry-run"

      # Migrations run BEFORE the deploy, and a failure here stops the job so the old
      # code keeps serving against the old schema.
      #
      # Uses CLOUDFLARE_D1_TOKEN, not the deploy token: CLOUDFLARE_API_TOKEN carries
      # Workers Scripts: Edit and nothing else, so it cannot touch D1 (argus#374).
      - name: Apply D1 migrations
        run: bash scripts/with-d1-id.sh pnpm exec wrangler d1 migrations apply DB --remote --config wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CLOUDFLARE_D1_TOKEN }}

      # Not `pnpm run worker:deploy`: that script checks a manual run's checkout against
      # origin/deploy, and this run is the promotion itself. Secrets
      # (WATCHTOWER_COLLECTOR_TOKEN) stay as set on the Worker; a deploy does not touch them.
      - name: Deploy to Cloudflare Workers
        run: bash scripts/with-d1-id.sh pnpm exec wrangler deploy
