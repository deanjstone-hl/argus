packages:
  - 'apps/*'
  - 'packages/*'

allowBuilds:
  better-sqlite3: true
  esbuild: true
  # agent-engine's live-notes embedder. Its CPU binaries ship in the package;
  # the postinstall only downloads CUDA ones, which nothing here uses.
  onnxruntime-node: false
  # Pulled in by onnxruntime-node; its postinstall only checks versions.
  protobufjs: false
  sharp: true
  workerd: true
