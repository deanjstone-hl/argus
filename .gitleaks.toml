# The scrub rules for this repository (argus#1207, after sys-admin#194 and skills/27): gitleaks' default rules plus personal-data
# rules, so the public tree holds no private value. Run `bash scripts/scrub-scan.sh`; it exits
# non-zero on a hit and never prints a value. Private values live in Bitwarden Secrets Manager
# and are read by name by scripts/private-value.sh and apps/watchtower-collector/deploy.sh (docs/public-cutover.md).
title = "argus scrub rules"

[extend]
useDefault = true

[[rules]]
id = "personal-email"
description = "An email address (a placeholder at example.com, example.org or a GitHub noreply address is fine)"
regex = '''[A-Za-z0-9._%+-]+@[A-Za-z0-9-]+(?:\.[A-Za-z0-9-]+)*\.[A-Za-z]{2,}\b'''
keywords = ["@"]

[[rules]]
id = "tailnet-hostname"
description = "A Tailscale MagicDNS hostname"
regex = '''[a-z0-9-]+\.ts\.net\b'''
keywords = ["ts.net"]

# The links registry (links.json and its generated TS copies) is vendored from the public
# deanjstone-hl/frontend registry, which publishes the tailnet host its tailnet entries need
# (argus#18). Allowed in those files only; a hostname anywhere else still fails.
[[rules.allowlists]]
description = "The vendored links registry names the tailnet host"
paths = [
  '''/links\.json$''',
  '''/apps/[a-z-]+/src/lib/links\.ts$''',
]

[[rules]]
id = "tailnet-ip"
description = "A Tailscale CGNAT address (100.64.0.0/10)"
regex = '''\b100\.(?:6[4-9]|[7-9][0-9]|1[01][0-9]|12[0-7])\.[0-9]{1,3}\.[0-9]{1,3}\b'''
keywords = ["100."]

[[rules]]
id = "lan-ip"
description = "A private LAN address (192.168/16, 10/8, 172.16/12)"
regex = '''\b(?:192\.168\.[0-9]{1,3}\.[0-9]{1,3}|10\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}|172\.(?:1[6-9]|2[0-9]|3[01])\.[0-9]{1,3}\.[0-9]{1,3})\b'''
keywords = ["192.168.", "10.", "172."]

[[rules]]
id = "au-mobile"
description = "An Australian mobile number"
regex = '''(?:\+61|\b0)[ -]?4[0-9]{2}[ -]?[0-9]{3}[ -]?[0-9]{3}\b'''
keywords = ["04", "+61"]

[[rules]]
id = "access-team-domain"
description = "A Cloudflare Access team domain (the team name is private)"
regex = '''[a-z0-9-]+\.cloudflareaccess\.com\b'''
keywords = ["cloudflareaccess.com"]

[[rules]]
id = "cloudflare-id"
description = "A 32 or 64 character hex id (account, zone, Access audience, policy group) or a UUID (D1 database id, Access user id)"
regex = '''\b(?:[0-9a-f]{64}|[0-9a-f]{32}|[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})\b'''

[[allowlists]]
description = "Placeholders and addresses that identify no one"
regexes = [
  '''@example\.(?:com|org|net|invalid|test)\b''',
  '''@users\.noreply\.github\.com\b''',
  '''noreply@(?:github|anthropic)\.com\b''',
  # The ssh user of GitHub, not a person.
  '''^git@github\.com$''',
  # A systemd template instance (postgres@15-main.service), not an address.
  '''@[^@]*\.(?:service|timer|socket|mount)$''',
  # The published sha256 of the pinned gitleaks release the CI job installs.
  '''^551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb$''',
  # The placeholder conventions of the public tree (docs/public-cutover.md): a UUID that starts
  # 00000000-0000-, a hex id with a run of 16 zeros, a tailnet address 100.64.0.1 to .20, the
  # tailnet name `tailnet-example` and the Access team `team`.
  '''^00000000-0000-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$''',
  '''0{16}''',
  '''^100\.64\.0\.(?:[1-9]|1[0-9]|20)$''',
  '''^tailnet-example\.ts\.net$''',
  '''^(?:owner|team|evil|example)\.cloudflareaccess\.com$''',
]
paths = [
  '''pnpm-lock\.yaml$''',
  '''scripts/ci/release-scripts\.lock$''',
  '''scripts/heavy-lock\.lock$''',
  '''\.gitleaks\.toml$''',
]

# A Secrets Manager secret id on a bitwarden/sm-action map line in a deploy workflow (argus#59): an id
# names a secret and reads nothing without the machine account's token. gitleaks matches the whole
# line, so the id is allowed only as `<uuid> > <ENV_NAME>` and nowhere else. Rule: cloudflare-id.
[[allowlists]]
description = "Secrets Manager ids in the sm-action map"
regexTarget = "line"
regexes = [
  '''^\s+[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12} > [A-Z][A-Z0-9_]+$''',
]
